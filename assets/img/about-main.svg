<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Engineers installing solar panels">
  <defs>
    <linearGradient id="am1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF6FE"/><stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="am2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5e80"/><stop offset="1" stop-color="#0E2A3B"/>
    </linearGradient>
  </defs>
  <rect width="520" height="420" fill="url(#am1)"/>
  <circle cx="430" cy="76" r="40" fill="#FFCC28"/>
  <g stroke="#ffffff" stroke-opacity=".7" stroke-width="2" fill="none">
    <path d="M60,70 q26,-16 52,0 q26,16 52,0"/>
    <path d="M90,110 q22,-14 44,0 q22,14 44,0"/>
  </g>
  <path d="M0,308 Q150,270 300,306 T520,296 V420 H0 Z" fill="#31C36C"/>
  <path d="M0,346 Q180,312 360,350 T520,340 V420 H0 Z" fill="#1e8f4d"/>
  <!-- large panel -->
  <g transform="translate(70,150)">
    <g transform="skewX(-10)">
      <rect width="270" height="150" rx="10" fill="url(#am2)" stroke="#fff" stroke-width="4"/>
      <g stroke="#EDF6FE" stroke-opacity=".5" stroke-width="2.5">
        <line x1="90" y1="0" x2="90" y2="150"/><line x1="180" y1="0" x2="180" y2="150"/>
        <line x1="0" y1="50" x2="270" y2="50"/><line x1="0" y1="100" x2="270" y2="100"/>
      </g>
      <rect x="10" y="10" width="70" height="30" rx="5" fill="#FFCC28" opacity=".9"/>
    </g>
    <rect x="40" y="150" width="14" height="58" fill="#0b2130"/>
    <rect x="200" y="150" width="14" height="58" fill="#0b2130"/>
  </g>
  <!-- engineer figure -->
  <g transform="translate(392,208)">
    <circle cx="0" cy="0" r="17" fill="#e8b98a"/>
    <path d="M-19,-6 a19,19 0 0 1 38,0 l-4,-2 -6,4 -8,-6 -8,6 -8,-4 Z" fill="#FFCC28"/>
    <rect x="-20" y="16" width="40" height="56" rx="14" fill="#31C36C"/>
    <rect x="-20" y="34" width="40" height="8" fill="#F0EFE4"/>
    <rect x="-16" y="72" width="13" height="46" rx="6" fill="#0E2A3B"/>
    <rect x="3" y="72" width="13" height="46" rx="6" fill="#0E2A3B"/>
    <rect x="-34" y="20" width="12" height="40" rx="6" fill="#31C36C" transform="rotate(18 -28 20)"/>
    <rect x="22" y="20" width="12" height="40" rx="6" fill="#31C36C" transform="rotate(-30 28 20)"/>
  </g>
  <g fill="#31C36C">
    <circle cx="330" cy="120" r="5"><animate attributeName="cy" values="120;108;120" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="230" r="4" opacity=".7"><animate attributeName="cy" values="230;220;230" dur="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
